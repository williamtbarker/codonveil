[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codonveil"
version = "0.1.0"
description = "Expose protein consequences hidden by IUPAC ambiguity in aligned coding sequences."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Will Barker"}]
keywords = ["bioinformatics", "codon", "fasta", "iupac", "quality-control"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/williamtbarker/codonveil"
Repository = "https://github.com/williamtbarker/codonveil"
Issues = "https://github.com/williamtbarker/codonveil/issues"

[project.scripts]
codonveil = "codonveil.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codonveil"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=codonveil --cov-branch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "scripts"]

[tool.coverage.run]
branch = true
source = ["codonveil"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]
